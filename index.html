<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>替马斯克花钱</title>
  <meta name="api-base" content="https://api.w1lkin.site">
  <script src="https://api.w1lkin.site/sdk.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="page-container"></main>
    <nav id="bottom-nav">
      <a href="#shop" class="nav-item active" data-route="shop">
        <span class="nav-icon">🏪</span>
        <span class="nav-label">商店</span>
      </a>
      <a href="#achievements" class="nav-item" data-route="achievements">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">成就</span>
      </a>
    </nav>
  </div>
  <div class="share-overlay" id="share-overlay">
    <div class="share-overlay-inner">
      <img class="share-card-img" id="share-card-img" src="" alt="分享卡片" crossorigin="anonymous">
      <p class="share-hint">长按图片保存，发到微信群或朋友圈</p>
      <button class="share-close" id="share-close-btn">关闭</button>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
  <nav class="gp-tabbar">
    <a href="https://game-list-arv.pages.dev" class="gp-tabbar-btn">
      <span class="gp-tabbar-ico">🏠</span>首页
    </a>
  </nav>
  <style>
    .gp-tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; justify-content: center; background: #fff; border-top: 1px solid #eef1ee;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
    .gp-tabbar-btn { display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; color: #8a9790; text-decoration: none; font-family: inherit; cursor: pointer; }
    .gp-tabbar-btn:active { color: #4472c4; }
    .gp-tabbar-ico { font-size: 18px; line-height: 1; }
    body { padding-bottom: 52px; }
  </style>
</body>
</html>
